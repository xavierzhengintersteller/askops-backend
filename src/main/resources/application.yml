spring:
  application:
    name: askopt-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/askops_db?currentSchema=askops_schema
    username: askops_admin
    password: 123456
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml                # MyBatis Mapper XML 文件路径
  type-aliases-package: com.example.askopt.model         # 实体类所在包
  configuration:
    map-underscore-to-camel-case: true                   # 开启驼峰命名自动转换
  redis:
    host: localhost
    port: 6379
    password: ""       # 如果有密码
    database: 0
    timeout: 5000ms

server:
  port: 8082
hmac:
  client-id: central-panel
  clients:
    central-panel: SUPER_SECRET_KEY_123

